# 本地开发：日志放开，健康检查能看到细节
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/shizhi
    username: postgres
    # 本地开发默认值，开箱即跑；需要时用环境变量覆盖。生产环境必须走环境变量
    password: ${SHIZHI_DB_PASSWORD:123456}

shizhi:
  jwt:
    # 本地专用，生产必须用环境变量覆盖。长度不足 32 字节启动会直接失败
    secret: ${SHIZHI_JWT_SECRET:shizhi-local-dev-secret-key-do-not-use-in-prod}
    # 开发环境放长，调试时不用反复登录；生产走 prod profile，不读这个文件
    access-ttl: 2h
  model:
    # 本地默认接真实模型；没有 key 时把 provider 改成 stub 即可跑通整条链路
    provider: openai-compatible
    base-url: https://open.bigmodel.cn/api/paas/v4
    api-key: ${SHIZHI_MODEL_API_KEY:}
    # 主力用不思考的 4-flash：稳、首字快。4.7 质量更高，但高峰期经常被限流，
    # 放在主位等于大部分请求要先等一次 429，所以只当备用。
    name: glm-4-flash
    fallback-name: glm-4.7-flash

logging:
  level:
    root: info
    com.ahz.shizhi: debug

management:
  endpoint:
    health:
      show-details: always
