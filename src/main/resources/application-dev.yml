# 本地开发：日志放开，健康检查能看到细节
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/shizhi
    username: postgres
    # 本地开发默认值，开箱即跑；需要时用环境变量覆盖。生产环境必须走环境变量
    password: ${SHIZHI_DB_PASSWORD:123456}

logging:
  level:
    root: info
    com.ahz.shizhi: debug

management:
  endpoint:
    health:
      show-details: always
