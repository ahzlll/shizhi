# 生产：2 核 2G 轻量服务器，Nginx 反代，systemd 托管
spring:
  datasource:
    url: ${SHIZHI_DB_URL}
    username: ${SHIZHI_DB_USER}
    password: ${SHIZHI_DB_PASSWORD}

shizhi:
  jwt:
    # 生产必须注入，没有默认值——缺了宁可启动失败，也不要跑一个用弱密钥签名的服务
    secret: ${SHIZHI_JWT_SECRET}

server:
  port: 8080
  # 让应用能拿到 Nginx 转发的真实 IP 与协议
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 50

logging:
  level:
    root: warn
    com.ahz.shizhi: info
  file:
    name: logs/shizhi.log

management:
  endpoints:
    web:
      exposure:
        include: health
