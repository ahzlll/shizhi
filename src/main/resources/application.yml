spring:
  application:
    name: shizhi
  # 默认开发环境，部署时用 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  datasource:
    hikari:
      pool-name: shizhi-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

shizhi:
  version: 0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
