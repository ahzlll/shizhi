spring:
  application:
    name: shizhi
  # 默认开发环境，部署时用 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  datasource:
    hikari:
      pool-name: shizhi-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

shizhi:
  version: 0.0.1
  jwt:
    access-ttl: 30m
    refresh-ttl: 14d
    issuer: shizhi

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
